# Server Configuration
server.port=8080
spring.application.name=crmeb-java

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/crmeb?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0

# JWT Configuration
jwt.secret=crmeb-java-secret
jwt.expiration=604800

# WeChat Pay Configuration
wechat.pay.mchId=${WECHAT_PAY_MCH_ID:}
wechat.pay.mchSerialNumber=${WECHAT_PAY_MCH_SERIAL_NUMBER:}
wechat.pay.privateKey=${WECHAT_PAY_PRIVATE_KEY:}
wechat.pay.apiV3Key=${WECHAT_PAY_API_V3_KEY:}
wechat.pay.appId=${WECHAT_PAY_APP_ID:}

# Alipay Configuration
alipay.appId=${ALIPAY_APP_ID:}
alipay.privateKey=${ALIPAY_PRIVATE_KEY:}
alipay.publicKey=${ALIPAY_PUBLIC_KEY:}
alipay.notifyUrl=${ALIPAY_NOTIFY_URL:}
alipay.returnUrl=${ALIPAY_RETURN_URL:}

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging Configuration
logging.level.root=INFO
logging.level.com.crmeb=DEBUG
